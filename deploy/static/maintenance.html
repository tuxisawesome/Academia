<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="8" />
    <title>Academia — updating</title>
    <style>
      :root { --bg:#f5efe3; --card:#fbf7ee; --ink:#2a241e; --muted:#6e6353; --line:#ddd2bd; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg:#191612; --card:#221e19; --ink:#ede5d5; --muted:#b3a792; --line:#3a332a; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      main { max-width: 420px; text-align: center; background: var(--card); border: 1px solid var(--line);
        border-radius: 14px; padding: 36px 30px; box-shadow: 0 10px 30px rgba(60,40,20,.08); }
      h1 { font-weight: 500; font-size: 27px; margin: 10px 0 8px; }
      p { color: var(--muted); line-height: 1.55; margin: 0; }
      .dot { display: inline-block; width: 10px; height: 10px; margin: 0 3px; border-radius: 50%; background: #7b2d26;
        animation: pulse 1.2s infinite ease-in-out; }
      .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
      @keyframes pulse { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
    </style>
  </head>
  <body>
    <main>
      <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <h1>Academia is updating</h1>
      <p>This takes a few seconds. The page reloads by itself when Academia is back.</p>
    </main>
  </body>
</html>
