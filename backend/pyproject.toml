[project]
name = "academia"
version = "1.0.0"
description = "Academia — a self-hosted library of PDF notebooks and bookmarks"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.133",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "argon2-cffi>=25.1",
    "pikepdf>=10.9,<11",
    "pypdfium2>=5",
    "pillow>=11.3",
    "typer>=0.16",
    "rapidfuzz>=3.13",
]

[project.scripts]
academia = "academia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.135",
    "ruff>=0.12",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["academia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM105", "UP047"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "W291", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["academia", "conftest"]
